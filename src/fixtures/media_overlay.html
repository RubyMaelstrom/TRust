<!doctype html>
<meta charset=utf-8>
<title>External playback controls — native layer acceptance</title>
<style>
body { margin:24px; font:18px sans-serif; background:#eee; color:#111 }
.player { position:relative; width:600px; height:210px; margin:24px 0; }
video { position:absolute; inset:0; width:100%; height:100%; }
.poster { position:absolute; inset:0; background:#234; color:white; padding:55px 24px 24px; box-sizing:border-box; }
.cover { position:fixed; top:20px; right:16px; background:#dce5ed; border:1px solid #456; padding:12px; z-index:2147483647; }
.scroller { height:240px; width:660px; overflow:auto; border:2px solid #456; }
.space { height:100px; }
</style>
<h1>Native mpv controls</h1>
<p>Both posters must remain intact. A native “Open in mpv” button must paint above each.</p>
<div class=player>
  <video id=direct src="clip.mp4"></video>
  <div class=poster>Authored opaque poster. Native playback must remain visible and clickable.</div>
</div>
<div class=scroller>
  <div class=space></div>
  <div class=player style="transform:translateX(20px)">
    <a href="/channel"><video id=stream></video></a>
    <div class=poster>Source-less video: the enclosing channel is the external playback URL.</div>
  </div>
  <div class=space></div>
</div>
<div style="height:600px"></div>
<div class=cover>Authored fixed layer <button onclick="this.parentElement.style.inset='0';this.parentElement.style.background='#456'">Cover page</button></div>
