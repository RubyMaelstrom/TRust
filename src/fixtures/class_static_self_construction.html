<!doctype html>
<meta charset="utf-8">
<title>Class static self-construction</title>
<main id="article">Article awaiting client initialization</main>
<script>
// ECMA-262 ClassDefinitionEvaluation: instance fields must be installed before
// a static initializer constructs an instance, including during deferred startup.
Promise.resolve().then(() => {
    class Registry {
        static shared = new Registry;
        encoders = [];
        #label = 'Article initialized';
        constructor() { this.register(value => this.#label + ': ' + value); }
        register(encode) { this.encoders.push(encode); }
        render(value) { return this.encoders[0](value); }
    }
    document.getElementById('article').textContent = Registry.shared.render('ready');
}).catch(error => {
    document.getElementById('article').textContent = 'Application error: ' + error;
    throw error;
});
</script>
