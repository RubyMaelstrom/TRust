[package]
name = "vt100"
version = "0.16.2"
authors = ["Jesse Luehrs <doy@tozt.net>"]
edition = "2021"
rust-version = "1.85"

description = "Library for parsing terminal data"
homepage = "https://github.com/doy/vt100-rust"
repository = "https://github.com/doy/vt100-rust"
readme = "README.trust.txt"
keywords = ["terminal", "vt100"]
categories = ["command-line-interface", "encoding"]
license = "MIT"
include = ["src/**/*", "LICENSE", "README*.txt", "CHANGELOG.upstream.txt"]

[dependencies]
itoa = "1.0.15"
unicode-width = "0.2.1"
unicode-segmentation = "1.13.3"
# The std feature makes OSC storage unbounded. The fixed-buffer parser still
# works inside std applications and caps remote titles/control strings.
vte = { version = "0.15.0", default-features = false }

[dev-dependencies]
nix = { version = "0.30.1", features = ["term"] }
quickcheck = "1.0"
rand = "0.9"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
terminal_size = "0.4.2"
