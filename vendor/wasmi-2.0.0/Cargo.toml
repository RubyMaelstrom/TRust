[package]
edition = "2024"
rust-version = "1.86"
name = "wasmi"
version = "2.0.0"
authors = ["Robin Freyler <robin.freyler@gmail.com>"]
build = "build.rs"
exclude = [
    "benches/wat",
    "benches/wasm",
    "tests/spec/testsuite",
    "**.wast",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "WebAssembly interpreter"
documentation = "https://docs.rs/wasmi/"
readme = "README.md"
keywords = [
    "wasm",
    "webassembly",
    "interpreter",
    "vm",
]
categories = [
    "wasm",
    "no-std",
    "virtualization",
]
license = "MIT/Apache-2.0"
repository = "https://github.com/wasmi-labs/wasmi"
resolver = "2"

[package.metadata.docs.rs]
features = [
    "std",
    "wat",
    "simd",
]

[features]
auto-dispatch = []
debug = ["wasmi_ir/debug"]
default = [
    "stable",
    "std",
    "wat",
    "validate",
    "memory64",
    "auto-dispatch",
]
deterministic = ["wasmi_core/deterministic"]
extra-checks = []
hash-collections = [
    "wasmi_collections/hash-collections",
    "wasmparser/hash-collections",
]
indirect-dispatch = ["wasmi_ir/slot16"]
libm = ["wasmi_core/libm"]
memory64 = [
    "wasmi_core/memory64",
    "wasmi_ir/memory64",
]
portable-dispatch = []
prefer-btree-collections = [
    "wasmi_collections/prefer-btree-collections",
    "wasmparser/prefer-btree-collections",
]
simd = [
    "wasmi_core/simd",
    "wasmi_ir/simd",
    "wasmparser/simd",
]
stable = []
std = [
    "wasmi_ir/std",
    "wasmi_core/std",
    "wasmi_collections/std",
    "wasmparser/std",
    "spin/std",
]
unstable = []
# TRust: optional Cranelift 0.136 hot-region compiler; requires Rust 1.96 or
# newer on supported JIT hosts (little-endian 64-bit AArch64 and x86-64).
native-jit = [
    "std",
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-native",
    "dep:rustc-hash",
]
validate = [
    "wasmparser/validate",
    "wasmparser/features",
]
wat = [
    "dep:wat",
    "std",
]

[lib]
name = "wasmi"
path = "src/lib.rs"

[[test]]
name = "mod"
path = "tests/mod.rs"

[[bench]]
name = "benches"
path = "benches/benches.rs"
harness = false

[dependencies.spin]
version = "0.9"
features = [
    "mutex",
    "spin_mutex",
    "rwlock",
]
default-features = false

[dependencies.wasmi_collections]
version = "2.0.0"
default-features = false

[dependencies.wasmi_core]
version = "2.0.0"
default-features = false

[dependencies.wasmi_ir]
version = "2.0.0"
default-features = false

[dependencies.wasmparser]
version = "0.228.0"
features = []
default-features = false

[dependencies.wat]
version = "1.228.0"
optional = true
default-features = false

[target.'cfg(any(target_arch = "aarch64", target_arch = "x86_64"))'.dependencies]
cranelift-codegen = { version = "=0.136.2", optional = true }
cranelift-frontend = { version = "=0.136.2", optional = true }
cranelift-jit = { version = "=0.136.2", optional = true }
cranelift-module = { version = "=0.136.2", optional = true }
cranelift-native = { version = "=0.136.2", optional = true }
rustc-hash = { version = "2.1.3", optional = true }

[dev-dependencies.assert_matches]
version = "1.5"

[dev-dependencies.wat]
version = "1.261.0"

# Native-JIT SIMD conformance runner for the official `*.wast` scripts.
[dev-dependencies.wast]
version = "261.0.0"

# Lowering checks of native regions for both supported native-JIT targets,
# independently of the test host.
[target.'cfg(any(target_arch = "aarch64", target_arch = "x86_64"))'.dev-dependencies]
cranelift-codegen = { version = "=0.136.2", features = ["arm64", "x86"] }

[dev-dependencies.criterion]
version = "0.5"
default-features = false
