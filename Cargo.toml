[package]
name = "TRust"
version = "0.1.0"
edition = "2024"
description = "Telnet in Rust — a GNU-telnet-compatible client and small-net (gopher, TLS) browser with a cyberpunk TUI"
license = "MIT OR Apache-2.0"

[lib]
name = "trust"
path = "src/lib.rs"

[[bin]]
name = "trust"
path = "src/main.rs"

[[bin]]
name = "trust-desktop"
path = "src/bin/trust-desktop.rs"

[features]
# `mimalloc` (default on) installs the mimalloc global allocator. Parse and
# bytecode-compile of large JS bundles are dominated by millions of small
# allocations (AST nodes, CodeBlocks); mimalloc is ~17% faster there than
# glibc malloc, end to end, behaviour-identically. It is the one C dependency
# (libmimalloc-sys) — the pure-Rust ethos is about the *engine* (Boa, not v8),
# not the allocator, and rustls already links C crypto — but it's isolated
# behind this feature: `--no-default-features` keeps the build pure-Rust.
default = ["mimalloc"]
# `libmimalloc-sys` (the same C lib mimalloc already pulls — no new build dep)
# exposes `mi_collect`, which we call at navigation boundaries to return a heavy
# page's freed high-water to the OS (see `release_allocator_memory`).
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

[dependencies]
accesskit = "0.24.1"
accesskit_winit = { version = "0.33.2", default-features = false, features = ["accesskit_unix", "tokio", "rwh_06"] }
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
boa_engine = { version = "0.21", features = ["annex-b"] }
# Direct dep for the lazy-parse control surface (`boa_parser::lazy`); the
# vendored crate is shared with boa_engine via `[patch]` below.
boa_parser = "0.21"
bytes = "1.11.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
# Default features = the pure-Rust `miniz_oxide` backend. NEVER enable the
# `zlib`/`zlib-ng`/`cloudflare_zlib`/`miniz-sys` features — those pull a C
# compressor and betray the pure-Rust ethos. Used for HTTP content decoding and
# the WHATWG Compression Streams API; the latter prevents sites from falling
# back to large interpreted JavaScript codecs.
flate2 = "1"
futures = "0.3.32"
html5ever = "0.39"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libmimalloc-sys = { version = "0.1", features = ["extended"], optional = true }
libmudtelnet = "2.0.2"
mimalloc = { version = "0.1", optional = true }
# Unicode shaping, font discovery/fallback, bidi, cluster mapping, and line
# metrics for the canonical CSS-pixel inline formatting context. TRust owns the
# surrounding CSS and retained-paint contracts; Parley is the font machinery.
# Keep the shaping/editor boundary current. Parley 0.11 requires ICU4X 2.1+;
# TRust's customized Boa 0.21 fork follows upstream Boa's current ICU4X 2.2
# pins so Cargo resolves one compiled-data provider across both engines.
# Linux/FreeBSD discovery is owned by `font_system`, so do not activate
# Fontique's native-system feature there. Other targets retain their native
# platform catalog until their equivalent configuration policy is owned here.
parley = { version = "0.11.0", default-features = false, features = ["std"] }
# Pure-Rust, path-backed catalog used to give usvg the exact same installed
# font set that is registered with Parley. The `fs` feature parses metadata
# with ttf-parser and keeps font bytes lazy; `fontconfig` and `memmap` stay off.
fontdb = { version = "0.23.0", default-features = false, features = ["fs"] }
# Character-presence checks for SVG fallback use the same parser as fontdb.
# Keeping the version aligned avoids parsing selected fonts through two table
# implementations.
ttf-parser = "0.25.1"
# Vello CPU's retained glyph cache/backend API. Keeping this direct dependency
# at the thin renderer adapter lets TRust forward variation coordinates and
# synthetic faces without leaking Glifo into layout/browser contracts.
glifo = "0.3.0"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
# FxHash for the DOM's hot maps (per-epoch caches, rule buckets, winner
# maps). Pure Rust, already in the tree via Boa; SipHash's HashDoS
# resistance buys nothing for arena-internal keys.
rustc-hash = "2"
serde_json = "1"
# Static SVG image rendering. `resvg`/`usvg`/tiny-skia are pure Rust; text and
# embedded data: raster images stay enabled for web compatibility. TRust
# supplies usvg's font database from its shared pure-Rust catalog. Keep
# `system-fonts` off: that feature independently interprets host Fontconfig
# state and would make HTML and SVG resolve different catalogs. `memmap-fonts`
# is deliberately omitted; selected SVG fonts are read safely on demand.
resvg = { version = "0.47.0", default-features = false, features = ["text", "raster-images"] }
roxmltree = "0.21.1"
rcgen = "0.14.8"
sha2 = "0.11.0"
textwrap = "0.16.2"
tiny-skia = "0.12.0"
svgtypes = "0.16.1"
tokio = { version = "1.52.3", features = ["net", "rt-multi-thread", "macros", "io-util", "sync", "time"] }
tokio-rustls = "0.26.4"
tui-term = "0.3.4"
unicode-width = "0.2"
# Extended grapheme boundaries complete Parley's shaping-cluster data for
# logical selection (notably emoji ZWJ sequences split by font fallback).
unicode-segmentation = "1.13.3"
# CSS Fonts 4 §5.1 requires Unicode Default Caseless Matching for every
# localized family name. Lowercasing is not equivalent (for example, ß/SS).
unicode-casefold = "0.2.0"
url = "2.5.8"
vello_cpu = { version = "0.2.0", default-features = false, features = ["std", "text", "u8_pipeline"] }
# Accelerated implementation of the same renderer-neutral display list.  Keep
# this synchronized with Vello CPU/Vello Common: all Vello API use is confined
# to `render::vello_hybrid`, and CPU remains the reference/fallback backend.
vello_hybrid = { version = "0.2.0", default-features = false, features = ["std", "text"] }
vello_common = { version = "0.2.0", default-features = false, features = ["std"] }
wgpu = { version = "30.0.0", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12", "gles"] }
vt100 = "0.16.2"
winit = "0.30.13"
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
# WebAssembly engine. wasmi is a pure-Rust interpreter (the Boa-analog — no
# v8/C++), so it preserves the pure-Rust-engine ethos. Runtime parses BINARY
# wasm only (the web ships binary), so the default `wat` feature is dropped;
# `simd` is enabled because the SIMD proposal is finalized and the crate is
# pure-Rust (v128 still cannot cross the JS boundary — that throws TypeError per
# the JS-API spec — but a module may use SIMD internally). The real work is the
# `WebAssembly.*` JS<->wasm bridge in src/js.rs.
wasmi = { version = "1", default-features = false, features = ["std", "simd"] }
webpki-roots = "1.0.7"

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
parley = { version = "0.11.0", default-features = false, features = ["system"] }

[dev-dependencies]
# Compiles readable `.wat` text into wasm bytes for the WebAssembly test
# fixtures. Pure-Rust (wasmi ecosystem); NEVER a runtime dependency — the
# runtime accepts only binary wasm from the web.
wat = "1"
# Test-only access to the vendored AST/interner for the lazy-parse (`lazy_scan`)
# fuzz harness: it walks the real parser's function-body spans and checks the
# fallible body-skip against them. Redirected to the vendored forks by
# `[patch.crates-io]` below. (`boa_parser` is a runtime dep above for the
# `boa_parser::lazy` control surface.)
boa_ast = "0.21"
boa_interner = "0.21"

[patch.crates-io]
fontique = { path = "vendor/fontique-0.11.0" }
crossterm = { path = "vendor/crossterm-0.29.0" }
# Vello Hybrid 0.2 is the current release, but upstream still pins wgpu 29.
# TRust carries this source-identical compatibility fork so the desktop uses
# wgpu 30's panic-safe SurfaceTexture teardown (gfx-rs/wgpu#9678). Keep the
# renderer changes confined to the fork and drop the patch when Vello updates.
vello_hybrid = { path = "vendor/vello_hybrid-0.2.0" }
# TRust's Boa fork. Boa is the only viable pure-Rust JS engine, but it's
# half-finished and we keep hitting its edges; we vendor it so we can fix
# the engine itself instead of working around it from js.rs. First fix:
# the cyclic-module `Debug` recursion that turned a recoverable module
# assert into an uncatchable stack-overflow abort (see src/module/*).
boa_engine = { path = "vendor/boa_engine-0.21.1" }
# Vendored alongside boa_engine so we own the front half of the binding-
# resolution pipeline too: boa_ast holds the scope analyzer that assigns
# each scope its runtime index and each identifier its BindingLocator. The
# `with` + `new Function` scope-index divergence (Vue's v-for) is born here,
# not in the VM — fixing it at the source lets us delete the downstream
# clamp/force band-aids instead of compounding them.
boa_ast = { path = "vendor/boa_ast-0.21.1" }
# Vendored so we own the garbage collector too. boa_gc is a full
# stop-the-world mark-sweep with a 1 MiB collection threshold and no public
# config; real SPA bundles churn megabytes of short-lived garbage and thrash
# it into hundreds of full-heap collections at boot. We add a per-page
# threshold knob (`set_gc_threshold`) and profiling counters (`gc_profile`)
# so the collector stops dominating heavy page loads.
boa_gc = { path = "vendor/boa_gc-0.21.1" }
# Vendored so we own the parser too — specifically to expose a RAW parse
# (`Parser::parse_script_raw`) that builds the AST without the scope-analysis
# pass the public entries force on. Raw parse touches no scope and no realm, so
# it can run on a worker thread with a private interner; this is the keystone of
# parallel parse (the JS-engine perf plan's Step 5a): the lexer/parser bulk of
# the "parse" phase moves off the page's `Context` thread, while scope analysis
# + compile stay sequential on the page thread (global lexical bindings resolve
# by slot index, so their order must be preserved). The analyzed AST holds
# `JsString` locators and is not `Send`; the raw one is, which is what lets it
# cross threads.
boa_parser = { path = "vendor/boa_parser-0.21.1" }
# TRust's vendored WebAssembly engine. wasmi is a pure-Rust interpreter (the
# Boa-analog); we vendor the wasmi-labs crates so we OWN the engine and can
# fork/patch it the way we do Boa, if a WASM showstopper ever needs it. No
# patches yet — wasmi is complete — so these are byte-for-byte the 1.1.0 crates.
# (`wasmparser`/`spin`/`libm` are third-party deps left on crates.io.)
wasmi = { path = "vendor/wasmi-1.1.0" }
wasmi_core = { path = "vendor/wasmi_core-1.1.0" }
wasmi_ir = { path = "vendor/wasmi_ir-1.1.0" }
wasmi_collections = { path = "vendor/wasmi_collections-1.1.0" }
# TRust's vendored ratatui-image fork (updated 11.0.4 -> 11.0.6 before vendoring:
# the 11.0.5 large-image multiply-overflow fix + the 11.0.6 chafa '\0' control-
# char filter; the sixel/sliced path is otherwise byte-identical to 11.0.4). We
# own it to memoize the per-image sixel byte-string: `SlicedSixelData::to_sequence`
# (`bands().join()`) rebuilt every visible image's whole sixel string on every
# full-frame redraw — the dominant at-rest main-thread cost on sixel terminals. The
# `SlicedProtocol::Sixel` variant now carries a 1-entry `SixelSeqCache` so an
# unchanged on-screen image is reused instead of rebuilt. See src/sliced.rs.
# 2026-07-03: both sixel sequence builders (`sixel::encode`, `to_sequence`) wrap
# the payload DECSC … DECRC+CUF1 so the cursor lands at anchor+1 — the position
# the ratatui backend assumes when it elides MoveTo for an adjacent next cell.
# The terminal's own post-sixel cursor (below the graphic) made such cells (the
# scrollbar thumb beside a 1-cell icon) print at stray positions, leaving
# persistent visual breaks in the scrollbar column.
ratatui-image = { path = "vendor/ratatui-image-11.0.6" }

# Optimized binary: whole-program LTO and a single codegen unit trade
# compile time for speed and size; symbols stripped (panic messages
# still print, just without a backtrace).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Release optimizations + debug symbols, for profiling the JS engine
# (perf is locked down on this host; gdb/poor-man's sampling needs symbols).
# Does not affect `cargo build --release`.
[profile.profiling]
inherits = "release"
debug = true
strip = false
